<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agri-OS Cloud Farm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                50: '#f4f7f4',
                100: '#e3ebe3',
                200: '#c5dacc',
                300: '#98bfa3',
                400: '#7da27e', // Base Sage
                500: '#527a53',
                600: '#3d5c40',
                800: '#334a35',
                900: '#2b3d2d',
              },
              burnt: {
                100: '#ffeadd',
                200: '#ffd5c0',
                300: '#ffaa80',
                400: '#e67e22',
                500: '#cc5500', // Burnt Orange
                600: '#a84600',
              },
              glacial: {
                100: '#e0f2fe',
                300: '#a5d8ff',
                400: '#7cc0ff',
                500: '#3b82f6', // Glacial Blue
                600: '#2563eb',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 8s linear infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* OS-like feel */
      }
      h1, h2, h3, .serif-font {
        font-family: 'Merriweather', serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(125, 162, 126, 0.4);
        border-radius: 2px;
      }
      
      /* v4.5 Natural Optics - Frosted Glass */
      .glass-optical {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
      }
      .glass-optical-dark {
        background: rgba(20, 35, 30, 0.5);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      }
      .glass-alert {
        background: rgba(204, 85, 0, 0.25);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(204, 85, 0, 0.4);
        box-shadow: 0 8px 32px 0 rgba(204, 85, 0, 0.15);
      }

      /* 3D Perspective Grid for Drone View */
      .perspective-container {
        perspective: 1200px;
        transform-style: preserve-3d;
        overflow: hidden;
      }
      .holo-grid {
        transform: rotateX(60deg) scale(2.0);
        background-image: 
          linear-gradient(rgba(125, 162, 126, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 162, 126, 0.3) 1px, transparent 1px);
        background-size: 100px 100px;
        width: 300%;
        height: 300%;
        position: absolute;
        top: -50%;
        left: -100%;
        animation: grid-move 20s linear infinite;
        mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
      }
      @keyframes grid-move {
        0% { transform: rotateX(60deg) scale(2.0) translateY(0); }
        100% { transform: rotateX(60deg) scale(2.0) translateY(100px); }
      }
      
      .heat-zone {
         background: radial-gradient(circle, rgba(204, 85, 0, 0.5) 0%, transparent 70%);
         filter: blur(20px);
         animation: pulse-heat 4s infinite alternate;
      }
      @keyframes pulse-heat {
        0% { opacity: 0.3; transform: scale(1); }
        100% { opacity: 0.7; transform: scale(1.2); }
      }

      /* True Thermal Vision Filter */
      .thermal-spectrum {
        /* Inverts and rotates hue to create a pseudo-thermal look from green/earth tones */
        filter: grayscale(100%) contrast(150%) brightness(1.1) invert(100%) hue-rotate(180deg);
        mix-blend-mode: hard-light;
      }
      /* Overlay to colorize the grayscale result */
      .thermal-overlay {
        background: linear-gradient(180deg, rgba(0,0,255,0.2), rgba(255,0,0,0.2), rgba(255,255,0,0.2));
        mix-blend-mode: overlay;
      }
      
      /* Rover HUD Animations */
      .hud-bracket {
        border-color: rgba(16, 185, 129, 0.9);
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      }
      
      .animate-scan-laser {
        animation: scan-laser 3s ease-in-out infinite;
      }
      @keyframes scan-laser {
        0% { top: 10%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 90%; opacity: 0; }
      }

      .mask-linear-fade {
        mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Autonomous Pulse */
      .pulse-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid rgba(204, 85, 0, 0.5);
        animation: ripple 2s linear infinite;
      }
      @keyframes ripple {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(2); opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0"
  }
}
</script>
</head>
  <body class="bg-[#e3ebe3] text-sage-900 antialiased h-screen w-screen selection:bg-sage-200 selection:text-sage-900">
    <div id="root"></div>
  </body>
</html>
